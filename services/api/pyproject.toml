[project]
name = "pricepilot-api"
version = "0.1.0"
description = "PricePilot AI shopping agent — API service"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "psycopg==3.2.3",
    "psycopg[binary]==3.2.3",
    "asyncpg==0.30.0",
    "redis==5.2.1",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.20",
    "alembic==1.14.0",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
]

[tool.setuptools]
packages = [
    "pricepilot",
    "pricepilot.config",
    "pricepilot.logging",
    "pricepilot.errors",
    "pricepilot.models",
    "pricepilot.db",
    "pricepilot.providers",
    "pricepilot.providers.ai",
    "pricepilot.providers.search",
    "pricepilot.providers.embeddings",
    "pricepilot.providers.vision",
    "pricepilot.providers.reviews",
    "pricepilot.matching",
    "pricepilot.normalization",
    "pricepilot.agents",
    "pricepilot.services",
    "pricepilot.api",
    "pricepilot.api.v1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.coverage.run]
source = ["pricepilot"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]