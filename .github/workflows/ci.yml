name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pricepilot
          POSTGRES_PASSWORD: pricepilot
          POSTGRES_DB: pricepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pricepilot -d pricepilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check pricepilot tests

      - name: Migrations (apply to clean service Postgres)
        env:
          DATABASE_URL: postgresql+psycopg://pricepilot:pricepilot@localhost:5432/pricepilot
        run: |
          cd ../../services/db && alembic upgrade head && alembic downgrade base && alembic upgrade head

      - name: Unit + integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://pricepilot:pricepilot@localhost:5432/pricepilot
          REDIS_URL: redis://localhost:6379/0
        run: pytest

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python dependency audit
        working-directory: services/api
        run: |
          pip install pip-audit
          pip-audit -r <(sed -n 's/^    "\(.*\)"$/\1/p' pyproject.toml | tr -d '^=' | grep -E '==|~=') || true

      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high || true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/worker/Dockerfile
          push: false